<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard</title>
    <!-- Web font for digital score and increment buttons -->
    <link rel="preconnect" href="https://fonts.cdnfonts.com">
    <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="scoreboard-container">
        <div class="score-row">
            <!-- HOME TEAM -->
            <div class="team-section">
                <h2 class="team-title">HOME</h2>
                <div id="home_score" class="score-display">0</div>
                <div class="button-group">
                    <button class="score-btn" onclick="addOne()">+1</button>
                    <button class="score-btn" onclick="addTwo()">+2</button>
                    <button class="score-btn" onclick="addThree()">+3</button>
                </div>
            </div>

            <!-- GUEST TEAM -->
            <div class="team-section">
                <h2 class="team-title">AWAY</h2>
                <div id="guest_score" class="score-display">0</div>
                <div class="button-group">
                    <button class="score-btn" onclick="addOneToGuest()">+1</button>
                    <button class="score-btn" onclick="addTwoToGuest()">+2</button>
                    <button class="score-btn" onclick="addThreeToGuest()">+3</button>
                </div>
            </div>
        </div>

        <div class="new-game-row">
            <button class="new-game-btn" onclick="newGame()">Start New Game</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
